<div class="overlay">
    <div class="popup">
        <div class="popup-icon">⚠️</div>
        <h3 class="popup-title">Abandonner la partie</h3>
        <p class="popup-message">Êtes-vous sûr de vouloir abandonner ? Vous ne pourrez pas rejoindre cette partie.</p>
        <div class="popup-actions">
            <button type="button" class="btn-cancel" (click)="onCancel()">Annuler</button>
            <button type="button" class="btn-confirm" (click)="onConfirm()">Abandonner</button>
        </div>
    </div>
</div>
