<div class="locked-overlay">
    <div class="locked-dialog">
        <h3 class="locked-title">Partie verrouillée</h3>
        <p class="locked-message">La partie que vous vouliez rejoindre est complète ou verrouillée.</p>
        <div class="locked-actions">
            <button class="locked-button-retry" (click)="onRetry()">Réessayer</button>
            <button class="locked-button-leave" (click)="onLeave()">Retour à l'accueil</button>
        </div>
    </div>
</div>
